derived_model:
  description: >-
    由本目录原始 URDF 经 scripts/tools/build_d2_model.py 生成的裸臂 MJCF
    片段（<mujocoinclude>，生成过程字节确定，测试防漂移）。
  fragments:
    - src/robot/d2_arm.xml
    - src/robot/d2_assets.xml
  rebuild_command: python scripts/tools/build_d2_model.py
  removed_from_urdf:
    - type: fixed_joint
      name: joint_8
      origin_xyz_m: [0.1888, 0, 0.024]
      parent: link_7
      child: link_8
    - type: link
      name: link_8
      mass_kg: 0.01
  removal_rationale: >-
    joint_8 为零轴固定关节，仅表达 link_8（0.01 kg 末端附件）的刚性安装；
    派生模型移除该固定段，原始 URDF 原样保留。工具安装面即被移除 joint_8
    的 origin（link_7 系 xyz=0.1888 0 0.024），后续 d2_flange site 与球拍
    由场景组装（Task 2.5）在该安装面挂接。
  collision_note: >-
    URDF collision 与 visual 引用同网格；生产裸臂遵循自碰撞关闭约定仅保留
    视觉 geom（contype=0/conaffinity=0），碰撞几何由后续场景/诊断模型决定。
  inertia_note: >-
    质量/COM/完整惯量张量逐字保留，未使用 balanceinertia 等修补；
    官方 URDF 惯量满足 MuJoCo 编译要求（编译实测通过）。

unknown_capabilities:
  joint_velocity_limits: >-
    未知。URDF 全部 <limit velocity="0">：按 0=官方未提供可用能力值解析，
    禁止写成有效零约束、无穷大或 RM65 默认值；派生 MJCF 不含速度限值。
  joint_effort_limits: >-
    未知。URDF 全部 <limit effort="0">：解析规则同上；派生 MJCF 及其测试
    场景的 motor 不设 ctrlrange/forcerange。
  implication: >-
    上述能力值待官方补充或真机辨识后，由运行参数层（runtime_parameters/
    model_factory，Task 2.2/2.5）以显式配置接入，不在模型侧虚构。
