derived_model:
  description: >-
    由本目录整机 URDF 经 scripts/tools/build_r1d_model.py 生成的
    MJCF 片段(<mujocoinclude>,生成过程字节确定,测试防漂移)。
    双侧裸臂由同一工具对同一 URDF 仅以 side 参数区分生成(独立导出,
    非单侧生成后镜像改名);臂片段根 body r1d_base 为 waist_yaw_link
    之上的虚拟固定安装点,完整模型维数不得等于规划维数——场景模板
    仅含选定臂 7 个铰链(nq=nv=nu=7),冻结环境段一律无关节。
  fragments:
    - src/robot/r1d_arm_left.xml
    - src/robot/r1d_arm_right.xml
    - src/robot/r1d_env.xml
    - src/robot/r1d_assets.xml
  rebuild_command: python scripts/tools/build_r1d_model.py
  removed_from_urdf:
    - {type: fixed_joint, name: left_dex1_base_joint, side: left, parent: left_wrist_yaw_link, child: left_dex1_base_link, note: 工具安装参考保留为 r1d_flange site}
    - {type: prismatic_joint, name: left_dex1_finger_joint_1, side: left, parent: left_dex1_base_link, child: left_dex1_finger_link_1}
    - {type: prismatic_joint, name: left_dex1_finger_joint_2, side: left, parent: left_dex1_base_link, child: left_dex1_finger_link_2}
    - {type: fixed_joint, name: left_dex1_camera_joint, side: left, parent: left_dex1_base_link, child: left_dex1_camera_link}
    - {type: link, name: left_dex1_base_link, side: left, mass_kg: 0.3649}
    - {type: link, name: left_dex1_finger_link_1, side: left, mass_kg: 0.092189}
    - {type: link, name: left_dex1_finger_link_2, side: left, mass_kg: 0.092189}
    - {type: link, name: left_dex1_camera_link, side: left, mass_kg: 0.021494}
    - {type: fixed_joint, name: right_dex1_base_joint, side: right, parent: right_wrist_yaw_link, child: right_dex1_base_link, note: 工具安装参考保留为 r1d_flange site}
    - {type: prismatic_joint, name: right_dex1_finger_joint_1, side: right, parent: right_dex1_base_link, child: right_dex1_finger_link_1}
    - {type: prismatic_joint, name: right_dex1_finger_joint_2, side: right, parent: right_dex1_base_link, child: right_dex1_finger_link_2}
    - {type: fixed_joint, name: right_dex1_camera_joint, side: right, parent: right_dex1_base_link, child: right_dex1_camera_link}
    - {type: link, name: right_dex1_base_link, side: right, mass_kg: 0.3649}
    - {type: link, name: right_dex1_finger_link_1, side: right, mass_kg: 0.092189}
    - {type: link, name: right_dex1_finger_link_2, side: right, mass_kg: 0.092189}
    - {type: link, name: right_dex1_camera_link, side: right, mass_kg: 0.021494}
  removal_rationale: >-
    阶段 2 单臂击球无灵巧手/视觉需求(N0-3(a)):dex1 夹爪(二指
    prismatic)与腕部相机固定子树从臂链移除;原始 URDF 原样保留。
    工具安装参考为被移除 {side}_dex1_base_joint 的 origin(左
    (0.0485, -0.003, 0.02)、右 (0.0485, 0.003, 0.02)),以 r1d_flange
    site 表达(不声称等于实物安装面);球拍由场景组装(Task 2.5b)在该
    site 挂接。
  env_excluded:
    wheels: [Left_Wheel_joint, Right_Wheel_joint]
    casters: [front_left_caster_Yaw_joint, front_left_caster_Roll_joint,
              front_right_caster_Yaw_joint, front_right_caster_Roll_joint,
              rear_left_caster_Yaw_joint, rear_left_caster_Roll_joint,
              rear_right_caster_Yaw_joint, rear_right_caster_Roll_joint]
    head: [head_pitch_joint, head_yaw_joint]
    waist_yaw_frozen_at: 0.0
    note: >-
      环境片段只到 waist_yaw_link 挂接点(N0-3(b));轮/脚轮/头不进
      场景模板;对侧臂不进入(每个场景仅选定侧);腰冻结 0(两套限位
      冲突集的公共值,审计报告 §5,不选边)。
  simplifications:
    mesh_simplification: none
    note: >-
      未做网格简化或包络替代:全部链上几何(含 4.18 MB 的
      base_link.STL 与 2.07 MB 的 waist_yaw_link.STL)保留官方 STL
      原样引用。未引用网格(夹爪/相机/轮/脚轮/头共 16 个)仅作资产
      留存于本目录,不进派生片段。
  lift_bake:
    mimic: lift_stage2_joint mimic lift_stage1_joint multiplier=1 offset=0
    travel_per_stage_m: [0.0, 0.425]
    total_travel_m: 0.85
    default_q_lift_m: 0.0
    rebuild_flag: --qL
    note: >-
      两级 prismatic 按同一 q_L bake 为固定 pos 偏移(stage1 z=0.0427+q_L,
      stage2 z=-0.2115+q_L);MuJoCo 的 URDF 导入不保留 mimic,升降冻结
      故无运行时等式约束。升降高度只由此 bake 表达,runtime 场景不提供
      第二套升降偏移。
  collision_note: >-
    URDF collision 与 visual 引用同网格(逐连杆校验);生产片段遵循
    自碰撞关闭约定仅保留视觉 geom(contype=0/conaffinity=0),碰撞几何
    由后续场景/诊断模型决定。
  inertia_note: >-
    质量/COM/完整惯量张量逐字保留,未使用 balanceinertia 等修补;
    官方 URDF 惯量满足 MuJoCo 编译要求(编译实测一次通过)。
  capability_note: >-
    URDF 的臂关节 effort/velocity 非 0(如肩 60 N·m / 18.8 rad/s,
    审计报告 §2 表),为官方声明值——不同于 D2 的"0=未知"规则;
    但未经实机验证,运行参数层不得直接写成安全限值(N0-9),
    派生片段不设 ctrlrange/forcerange/速度限值。
