# R1D 阶段 3 固定可达击球案例（scenario，schema v1）——右臂验收。
#
# 用途：本文件把「确定性击球验收」所需的输入冻结成单一案例，供
# tests/test_r1d_closed_loop.py 读取并驱动真实 run_r1d_episode 调用链。
# 路径一律相对本文件所在目录解析（本文件位于 configs/scenarios/）。
#
# 案例来源（Task 3.11，2026-11-18 右臂重标定）：先按右臂 FK/IK 与固定
# 重力抛物线反推可达来球，再落盘固定；seed 固定为 42，不做 seed 扫描/挑选。
#  - 来球：从 [2.5, -0.25, 2.8] m 以 [-5.0, 0.2, -1.0] m/s 飞出（纯重力
#    抛物线，不含空气阻力）；t≈0.445s 时到达 [0.25, -0.16, 1.357] m。
#  - 击球点可达性验算：右肩世界位置 [0.059, -0.086, 1.358] m（阶段 2
#    模板实测），击球点相对肩 [0.191, -0.074, -0.001] m（|·|≈0.205m <
#    臂展 0.35m）；对 [0.25, -0.16, 1.357] 从规划段 q 起做 IK，各关节
#    离限位有余量；执行器 torque_max/PD/限位来自
#    configs/robots/r1d_sim_runtime_right.yaml（provisional）。
#  - 案例验收：hit_type 必须为 active（真实球—拍接触、接触拍速 >0.3 m/s），
#    且同 seed/同配置连续 3 次逐位一致（详见验收报告）。
#
# 注意：本文件不引入新的配置框架，字段与 3.10 run_r1d_episode 的三份
# 配置参数一一对应；expected_hit_type 仅表达本案例的预期，不改变任何
# 判定逻辑（判定仍由 3.9 的物理接触检测给出）。
schema_version: 1
profile_path: ../robots/r1d_right.yaml              # 右臂 profile（阶段 2 产物）
runtime_path: ../robots/r1d_sim_runtime_right.yaml  # 右臂仿真 runtime（provisional）
task_path: ../r1d_sim_right.yaml                    # 右臂仿真 task（3.11 已调参）
seed: 42                                            # 固定 seed（不扫描/不挑选）
expected_hit_type: active                          # 固定案例期望：主动击球
