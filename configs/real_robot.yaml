# ═══════════════════════════════════════════════════════════════
# RM-65B 真机部署配置
# ═══════════════════════════════════════════════════════════════
#
# 实验时最常调整（按优先级）:
#   1. [3] safety.collision_stage  — 碰撞灵敏度，首次 5，稳定后降低
#   2. [3] safety.max_tcp_speed    — TCP 速度限制，0.5→1.0 逐步提高
#   3. [2] control.control_mode     — "ip"(稳) vs "canfd"(高跟随)
#   4. [4] position_mode.kp / kd   — PD 增益，跟踪精度
#   5. [7] perception pos/vel_std  — KF 滤波强度
#
# 标记: ✅=默认可用 | ⚠️=需真机标定 | 📋=参考SDK默认
# 单位约定: YAML 中关节角度用「度」(与SDK一致)，config.py 自动转弧度


# ── [1] 机器人连接 ──────────────────────────────────────────────
# RM-65B 网口连接，控制器默认 IP:
#   左臂 192.168.1.18 / 右臂 192.168.1.19 / 端口固定 8080
robot:
  ip: "192.168.1.18"
  port: 8080


# ── [2] 控制模式 ───────────────────────────────────────────────
# 真机只支持角度控制（无力矩API）。两种通信方式:
#   "ip"    → rm_movej_follow()，控制器内部规划，简单稳定
#   "canfd" → rm_movej_canfd()，透传高跟随，周期须 ≤10ms
control:
  control_mode: "ip"
  dt: 0.005                     # MPC 规划步长（秒），5ms=200Hz
  canfd_trajectory_mode: 1      # canfd专用: 0=透传 1=曲线拟合 2=滤波
  canfd_smooth_radio: 50        # canfd专用: 平滑系数 0-100


# ── [3] 控制器安全配置（Layer 1，连接时自动下发）─────────────
# 由 RM-65B 控制器固件实时执行，不占用控制循环时间。
# 三层安全: Layer1=控制器固件 / Layer2=SafetyMonitor软件 / Layer3=急停
safety:
  # 碰撞检测: 0=关(危险!) ~ 8=最灵敏(易误触发)
  # 建议: 首次 5，确认无误触发后降至 3-4
  collision_stage: 5            # ⚠️ 外部碰撞灵敏度 0-8
  enable_self_collision: true   # ✅ 自碰撞检测（臂段间）
  enable_singularity_avoidance: true  # ✅ 奇异性规避

  # 力矩硬限制: 超限时控制器立即停关节
  # [关节1~3 肩肘] 力矩大, [关节4~6 腕部] 力矩小
  torque_limit: [50, 50, 50, 30, 30, 30]  # ⚠️ N·m

  # TCP 速度/加速度限制（控制器固件 + SafetyMonitor 软件双重检查）
  max_tcp_speed: 1.0            # ⚠️ 末端最大线速度 m/s
  max_line_acc: 0.5             # 📋 末端最大线加速度 m/s²
  max_angular_speed: 0.2        # 📋 末端最大角速度 rad/s
  max_angular_acc: 1.0          # 📋 末端最大角加速度 rad/s²

  # 关节速度限制（SafetyMonitor 软件检查）
  max_qdot: [3.14, 3.14, 3.14, 3.14, 3.14, 3.14]  # ✅ rad/s

  # 关节位置限制（RM-65B 出厂范围，度）
  q_lower: [-180, -270, -150, -180, -115, -180]
  q_upper: [ 180,   90,  150,  180,  115,  180]


# ── [4] 位置模式 PD 参数 ──────────────────────────────────────
# MuJoCo 规划模型用 PD 执行器模拟真机控制器，iLQR 规划 q_desired。
# kp=刚度(大→准但易震) / kd=阻尼(大→抑震但慢)
# 调参: 先调 kd 消除震荡，再调 kp 提高精度
position_mode:
  kp: [200, 200, 100, 50, 50, 20]   # ⚠️ N·m/rad
  kd: [20, 20, 10, 5, 5, 2]         # ⚠️ N·m·s/rad
  enable_feedforward: true           # ✅ 重力+科氏力前馈补偿


# ── [5] 力矩→位置转换器（位置模式不用，力矩规划备用）──────────
torque_to_position:
  M_diag: [5.0, 5.0, 3.0, 1.0, 1.0, 0.5]  # 📋 对角惯量 kg·m²


# ── [6] 关节零位偏移 ─────────────────────────────────────────
# 仿真 vs 真机关节零位差异。标定: 同一姿态对比仿真和 rm_get_joint_degree()
joint_zero_offset: [0, 0, 0, 0, 0, 0]  # ⚠️ 弧度


# ── [7] 感知配置 ─────────────────────────────────────────────
# BallPerceiver: BallSensor → 卡尔曼滤波 → (pos, vel) → MPC
perception:
  sensor_type: "simulated"      # "simulated" / "optitrack" / "realsense"
  pos_noise_std: 0.005          # ⚠️ 位置噪声 m（动捕5mm / 深度相机20-50mm）
  vel_noise_std: 0.1            # ⚠️ 速度噪声 m/s
