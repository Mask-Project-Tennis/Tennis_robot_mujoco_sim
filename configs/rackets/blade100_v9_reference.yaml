    - [0.012218670624423056, 0.0, 0.0]
    - [0.0, 0.011802990087823463, 0.0]
    - [0.0, 0.0, 0.0004602159860017499]
mount:
  position: [0.0, 0.0, 0.03]
  wxyz: [1.0, 0.0, 0.0, 0.0]
