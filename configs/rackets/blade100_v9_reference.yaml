  face_area: 0.0645
  face:
    shape: ellipse
    center: [0.0, 0.0, 0.5189]
    semi_axes: [0.004, 0.123, 0.1669]
  handle:
    shape: capsule
    start: [0.0, 0.0, 0.014]
    end: [0.0, 0.0, 0.176]
    radius: 0.014
  throat:
    - shape: capsule
      start: [0.0, 0.035, 0.19]
      end: [0.0, 0.09, 0.352]
      radius: 0.009
    - shape: capsule
      start: [0.0, -0.035, 0.19]
      end: [0.0, -0.09, 0.352]
      radius: 0.009
  frame:
    - shape: capsule
      start: [0.0, -0.112, 0.363]
      end: [0.0, 0.112, 0.363]
      radius: 0.011
    - shape: capsule
      start: [0.0, -0.112, 0.6748]
      end: [0.0, 0.112, 0.6748]
      radius: 0.011
    - shape: capsule
      start: [0.0, 0.112, 0.363]
      end: [0.0, 0.112, 0.6748]
      radius: 0.011
    - shape: capsule
      start: [0.0, -0.112, 0.363]
      end: [0.0, -0.112, 0.6748]
      radius: 0.011
mass: 0.316
