# 参考成人拍球拍参数档案（Wilson Blade 100 V9，100 in² 拍面）
#
# 用途：R1D-V12 parity 任务 T1 的成人拍参考配置，用于在旧拍（0.35 kg 简化拍）之外
#      提供一份接近真实球拍的几何/惯量；官方规格字段标 official，几何形状与惯量为
#      合理刚体近似（标 estimated + method），不得伪称实测。
#
# 官方规格（2026-11-18 查询 Wilson 官方产品页）：
#   * 长度 27 in = 685.8 mm；
#   * 拍面 100 in² = 645 cm² = 0.0645 m²；
#   * 穿线质量 11.1 oz = 316 g（注意：不是未穿线 300 g）；
#   * 平衡点 33.02 cm ≈ 0.33 m（柄底起算）；
#   * 框厚 22 mm。
#
# 坐标系约定（SI）：
#   * 局部系原点 = 柄底；+Z 长轴指向拍头；+X 拍面法向；+Y 右手系；
#   * TCP = 拍面几何中心 = (0, 0, 0.5189)；
#   * mount 表示 p_flange = R(wxyz) @ p_local + position。
#
# 几何/惯量的构造方式（详见各项 method）：
#   * 拍面：椭圆薄板，半宽由官方面积与半长反解（0.123 m），半长取拍头半长 0.1669 m；
#   * 手柄：14 mm 半径胶囊，柄底 tip 在原点，上端 0.19 m；
#   * 喉部：两段 9 mm 半径胶囊连接柄顶与框体底边；
#   * 框体：4 段 11 mm 半径胶囊组成矩形环，框厚 = 2r = 22 mm（官方值）；
#   * 惯量：均质圆柱杆 + 实心椭球拍头的两刚体近似，按官方平衡点反解质量分配后用
#     平行轴定理合成（见 inertia provenance method）。
schema_version: 1
racket_id: blade100_v9_reference
description: "参考成人拍：Wilson Blade 100 V9（685.8 mm / 0.0645 m² / 穿线 0.316 kg / 平衡点 0.33 m / 框厚 0.022 m）"
