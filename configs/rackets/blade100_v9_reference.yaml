      - [8.75e-06, 0.0, 0.0]
      - [0.0, 8.75e-06, 0.0]
      - [0.0, 0.0, 1.0e-05]
provenance:
  geometry.length:
    source: official
    units: m
    reference: "Wilson Blade 100 V9 官方产品页：长度 27 in = 685.8 mm（https://www.wilson.com/en-us/product/blade-100-v9-wr079711u，2026-11-18 查询）"
    method: null
  geometry.tcp:
    source: estimated
    units: m
    reference: null
    method: "TCP 取拍面椭圆几何中心（假设 TCP = 拍面中心）：z = length - 半长 = 0.6858 - 0.1669 = 0.5189 m；非实测，装配后应复测"
  geometry.face_area:
    source: official
    units: m^2
    reference: "Wilson Blade 100 V9 官方产品页：拍面 100 in² = 645 cm² = 0.0645 m²（2026-11-18 查询）"
    method: null
  geometry.face:
    source: estimated
    units: m
    reference: null
    method: "拍面按椭圆薄板近似：半长取拍头半长 0.1669 m（= (length - 0.352)/2），半宽由官方面积反解 0.123 m（π·0.123·0.1669 ≈ 0.06449 m²），半厚 0.004 m 为薄板近似；形状与厚度非实测"
  geometry.handle:
    source: estimated
    units: m
    reference: null
    method: "手柄按 14 mm 半径轴向胶囊近似：柄底 tip 在局部系原点（z=0），上端 z = 0.19 m（握把长度量级估计）；非实测"
  geometry.throat:
    source: estimated
    units: m
    reference: null
    method: "喉部用两段 9 mm 半径胶囊近似：从柄顶 (±0.035, 0.19) 张至框体底边 (±0.09, 0.352)；走向与半径非实测"
  geometry.frame:
    source: estimated
    units: m
    reference: "Wilson Blade 100 V9 官方产品页：框厚 22 mm（仅框厚为官方值）"
    method: "框体用 4 段 11 mm 半径胶囊在 x = 0 平面内组成矩形环：两根横杆沿 ±Y（y = -0.112 ↔ +0.112，z = 0.363 / 0.6748），两根侧杆沿 ±Z（y = ±0.112，z = 0.363 ↔ 0.6748），外沿 y = ±0.123、z ∈ [0.352, 0.6858]（矩形化近似拍头轮廓）；半径取自官方框厚 22 mm 的一半，非实测"
  mass:
    source: official
    units: kg
    reference: "Wilson Blade 100 V9 官方产品页：穿线质量 11.1 oz = 316 g（2026-11-18 查询；注意官方未穿线质量为 300 g，本档案采用穿线值）"
    method: null
  com:
    source: official
    units: m
    reference: "Wilson Blade 100 V9 官方产品页：平衡点 33.02 cm ≈ 0.33 m（自柄底起算，2026-11-18 查询）"
    method: null
  inertia:
    source: estimated
    units: kg·m^2
    reference: null
    method: "两刚体近似：均质圆柱杆（z ∈ [0, 0.352] m，r = 0.014 m） + 实心椭球拍头（半轴 0.022/0.123/0.1669 m，中心 z = 0.5189 m）；按官方平衡点 0.33 m 反解杆/头质量分配（m_杆 ≈ 0.1741 kg、m_头 ≈ 0.1419 kg），用平行轴定理合成相对整体质心的惯量；非实测"
  mount.position:
    source: estimated
    units: m
    reference: null
    method: "假设法兰与柄底之间由 30 mm 连接件过渡，柄底位于法兰系 z = 0.03 m；T7 装配标定时修正，非实测"
  mount.wxyz:
    source: estimated
    units: "1"
    reference: null
    method: "假设球拍局部系与法兰系轴向一致（单位四元数）；T7 装配标定时修正，非实测"
  connector.geometry:
    source: estimated
    units: m
    reference: null
    method: "连接件按 20 mm 半径、30 mm 长圆柱近似，沿 +Z 置于法兰（法兰系 z=0）与柄底（法兰系 z=0.03 m）之间，对应局部系中心 z = -0.015 m；非实测"
  connector.mass:
    source: estimated
    units: kg
    reference: null
    method: "连接件质量按 50 g 估计（铝合金法兰/转接盘量级），非实测"
  connector.com:
    source: estimated
    units: m
    reference: null
    method: "连接件质心取圆柱几何中心 (0, 0, -0.015) m；非实测"
  connector.inertia:
    source: estimated
    units: kg·m^2
    reference: null
    method: "均质实心圆柱惯量近似：I_axis = m·r²/2 = 1.0e-5 kg·m²，I_trans = m(3r² + L²)/12 = 8.75e-6 kg·m²；非实测"
